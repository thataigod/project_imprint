name: CI

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 xvfb
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "numpy<2.0" "cython>=3.0" "setuptools<84" wheel
        pip install --no-build-isolation --no-deps insightface==0.7.3
        pip install -r requirements-dev.txt

    - name: Audit dependencies for vulnerabilities
      run: |
        pip-audit -r requirements.lock

    - name: Lint with ruff
      run: |
        ruff check src/imprint/ tests/ scripts/ packaging/

    - name: Run mypy type checker
      run: |
        mypy src/imprint/

    - name: Run tests with pytest
      run: |
        xvfb-run -a pytest tests/ -v --cov=imprint --cov-fail-under=100
